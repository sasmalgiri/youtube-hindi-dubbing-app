# Offline CI (tracker A02, T01). Runs on every push and pull request.
#
# What this proves: the release tests (module matrix, billing/ledger, payments,
# batches, languages, privacy, delivery checks, security, ops), tracker
# alignment, no known vulnerable web dependencies, the web type-check and build. What it does NOT run: GPU models,
# provider calls, or the full dialogue suite (those need the owner's CUDA
# environment; see docs/release/TRACKER.md "evidence" for where they ran).
# The manual scripts backend/test_google_tts.py, test_sarvam_tts.py and
# test_srtdub_runtime.py call live/paid providers and are never run here.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the light test set (versions match the owner's working environment)
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.115.6 pydantic==2.10.4 starlette==0.41.3 sse-starlette==2.1.0 \
            httpx==0.28.1 python-multipart==0.0.20 pytest==8.4.2 numpy==2.2.6 python-dotenv==1.1.1 \
            requests==2.32.3 uvicorn==0.34.0
      - name: Tracker and TODO cover each other
        run: python docs/release/check_alignment.py
      - name: ffmpeg (delivery checks probe real media)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Release tests (billing, payments, batches, languages, privacy, delivery, security, ops)
        working-directory: backend
        env:
          VOICEDUB_PROFILE: local
        run: >
          python -m pytest -q -p no:cacheprovider
          tests_dialogue/test_features.py tests_dialogue/test_billing.py tests_dialogue/test_payments.py
          tests_dialogue/test_submission.py tests_dialogue/test_batches.py tests_dialogue/test_languages.py
          tests_dialogue/test_worldwide_billing.py tests_dialogue/test_account_deletion.py
          tests_dialogue/test_hosted_security.py tests_dialogue/test_rate_limit.py tests_dialogue/test_delivery_check.py
          tests_dialogue/test_ops_health.py tests_dialogue/test_backup_restore.py tests_dialogue/test_crash_recovery.py
          tests_dialogue/test_mt_guard.py tests_dialogue/test_storage_setup.py tests_dialogue/test_narration.py
          tests_dialogue/test_speaker_review.py tests_dialogue/test_translation_bench.py
          tests_dialogue/test_provider_failures.py tests_dialogue/test_load_stress.py
          tests_dialogue/test_e2e_review_revoice.py tests_dialogue/test_chunked_upload.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: No known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=low
      - run: npx tsc --noEmit -p .
      - run: npm run build
